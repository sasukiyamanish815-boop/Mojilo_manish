name: Build Mojilo Manish APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          rm -rf project
          mkdir project
          unzip -o mojilo-manish-github-apk.zip -d project

      - name: Find Android project
        run: |
          echo "Searching for Android project..."
          find project \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: |
          PROJECT_DIR=$(dirname "$(find project \
            \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
            -print -quit)")

          echo "Android project directory: $PROJECT_DIR"

          cd "$PROJECT_DIR"

          gradle assembleDebug --no-daemon

      - name: Find APK
        run: |
          echo "Searching for APK..."
          find project -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mojilo-manish-apk
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
