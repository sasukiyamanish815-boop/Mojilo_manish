name: Build Mojilo Manish APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          mkdir project
          unzip -o mojilo-manish-github-apk.zip -d project

      - name: Find project directory
        run: |
          echo "ZIP contents:"
          find project -maxdepth 3 -type f | head -100

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        working-directory: project
        run: chmod +x gradlew || true

      - name: Build Debug APK
        working-directory: project
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mojilo-manish-apk
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
